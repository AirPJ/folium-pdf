[package]
name = "folium-pdf"
version = "0.2.1"
description = "Folium PDF — a free, ad-free, offline PDF tool"
authors = ["Folium PDF contributors"]
license = "GPL-3.0-or-later"
repository = "https://github.com/AirPJ/folium-pdf"
edition = "2021"

[lib]
name = "folium_pdf_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
urlencoding = "2"
qpdf = { version = "0.3", features = ["vendored"] }
getrandom = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
