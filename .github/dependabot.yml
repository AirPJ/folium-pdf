# Weekly pull requests for dependency updates, and immediate ones for
# security fixes. Grouped so there is one pull request per ecosystem.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ["*"]

  # The Tauri CLI used by the job that signs updates (keep it on the same
  # version as the app's @tauri-apps/cli).
  - package-ecosystem: npm
    directory: /scripts/signer
    schedule:
      interval: weekly
    groups:
      signer:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
    groups:
      cargo:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
