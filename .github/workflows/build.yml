# Builds the Windows installer on every change.
# - Every push to main: the installer is published as the "Test build"
#   pre-release (Releases page), replacing the previous one, together with
#   latest.json, which the in-app updater reads.
# - A tag like v0.3.0: a draft release is created with the installer.
# - Pull requests: the app is built to check it compiles.
#
# Updates are signed with the key in the TAURI_SIGNING_PRIVATE_KEY secret
# (and its password, TAURI_SIGNING_PRIVATE_KEY_PASSWORD). Without them the
# installer is still built, but no update is published.
#
# Security (see the audit in the project docs):
# - The signing key is given to ONE step only, "Sign the installer", which
#   runs nothing but the Tauri CLI. Installing dependencies and building
#   never see it, so a compromised npm package or build script cannot
#   steal it.
# - Dependencies are installed without running their install scripts.
# - Third-party actions are pinned to exact commits (the comment gives the
#   version); Dependabot proposes updates.
# - The workflow token is read-only except in the job that publishes.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    permissions:
      contents: write # publish the test build and draft releases
    env:
      # Only whether a key exists ("yes"/"no"), never the key itself.
      SIGNING: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies (without running their install scripts)
        run: |
          npm ci --ignore-scripts
          node scripts/copy-pdfjs-assets.mjs

      - name: Check translations
        run: npm run i18n:check

      - name: Set build version
        id: version
        run: node scripts/ci-version.mjs

      # Built without update files: the installer is signed in the next step.
      - name: Build the app and installer
        shell: bash
        run: npx tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Sign the installer (update signature)
        if: env.SIGNING == 'yes' && github.event_name != 'pull_request'
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          for f in src-tauri/target/release/bundle/nsis/*-setup.exe; do
            npx --no-install tauri signer sign "$f"
          done

      - name: Publish test build (main branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p out
          if [ "$SIGNING" = "yes" ]; then
            node scripts/ci-update-manifest.mjs "$VERSION" \
              "https://github.com/${GITHUB_REPOSITORY}/releases/download/test-build" out
          else
            echo "::warning::No signing key secret: publishing without update files."
            cp src-tauri/target/release/bundle/nsis/*-setup.exe "out/Folium-PDF_${VERSION}_x64-setup.exe"
            printf '%s\n' "$RELEASE_NOTES" | grep -viE '^(Co-Authored-By|Claude-Session):' > release-notes.md
          fi
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build out/* \
            --prerelease --target "$GITHUB_SHA" \
            --title "Test build ${VERSION} ($(date -u +%Y-%m-%d))" \
            --notes-file release-notes.md

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          draft: true
          files: src-tauri/target/release/bundle/nsis/*.exe

  # Known vulnerabilities in dependencies, and the Rust unit tests.
  # Runs alongside the build; a failure here does not stop publishing, but
  # shows as a failed check on the commit.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: npm audit
        run: npm audit --audit-level=high

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri -> target

      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2
        with:
          tool: cargo-audit

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit

      - name: Build the interface (the Rust side embeds it)
        run: |
          npm ci --ignore-scripts
          node scripts/copy-pdfjs-assets.mjs
          npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev
          cargo test
