# Builds the Windows installer on every change.
# - Every push to main: the installer is published as the "Test build"
#   pre-release (Releases page), replacing the previous one.
# - A tag like v0.1.0: a draft release is created with the installer.
# - Pull requests: the app is built to check it compiles.

name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Check translations
        run: npm run i18n:check

      - name: Build the app and installer
        run: npx tauri build --bundles nsis

      - name: Publish test build (main branch)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release delete test-build --cleanup-tag --yes || true
          gh release create test-build src-tauri/target/release/bundle/nsis/*.exe \
            --prerelease --target "$GITHUB_SHA" \
            --title "Test build ($(date -u +%Y-%m-%d), ${GITHUB_SHA::7})" \
            --notes "Automatic build of the latest changes. Not an official release. Windows may warn that the app is unrecognised: click More info, then Run anyway."

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: src-tauri/target/release/bundle/nsis/*.exe
